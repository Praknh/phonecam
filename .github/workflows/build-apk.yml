name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Building in $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-apk
          path: "**/app-debug.apk"
